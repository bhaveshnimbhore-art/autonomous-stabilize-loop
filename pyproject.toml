[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-stabilize-loop"
version = "2.0.0"
description = "Free write-test-stabilize loop: full test suite must pass, or original code is restored."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
